<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: AppLayout('letter', ~{::content}, null)}">
<th:block th:fragment="content">

    <div class="px-4 pt-8 pb-24">
        <!-- Header with Back Button -->
        <div class="mb-6 flex items-center justify-between">
            <button onclick="history.back()"
                    class="flex items-center gap-2 text-gray-600 hover:text-gray-900 transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                </svg>
                <span class="font-medium">뒤로</span>
            </button>

            <!-- 상태 뱃지 -->
            <div class="flex flex-col gap-1">
                <!-- (1) 보낸 편지: 전송 상태 -->
                <div>
                    <span th:if="${letter.isCancelled}"
                          class="text-xs font-medium text-gray-500 bg-gray-100 px-3 py-1 rounded-full">전송취소</span>
                    <span th:if="${letter.isSender && !letter.isCancelled}"
                          class="text-xs font-medium text-blue-500 bg-blue-50 px-3 py-1 rounded-full">전송완료</span>
                </div>

                <!-- (2) 보낸 편지: 상대방 읽음 여부 -->
                <div th:if="${letter.isSender && !letter.isCancelled}">
                    <span th:if="${letter.isRead}"
                          class="text-xs font-medium text-green-500 bg-green-50 px-3 py-1 rounded-full">상대방 읽음</span>
                    <span th:if="${!letter.isRead}"
                          class="text-xs font-medium text-red-500 bg-red-50 px-3 py-1 rounded-full">상대방 안읽음</span>
                </div>

                <!-- (3) 받은 편지: 읽음 여부 -->
                <div th:if="${!letter.isSender && !letter.isCancelled }">
                    <span th:if="${letter.isRead}"
                          class="text-xs font-medium text-blue-500 bg-blue-50 px-3 py-1 rounded-full">읽음</span>
                    <span th:if="${!letter.isRead}"
                          class="text-xs font-medium text-red-500 bg-red-50 px-3 py-1 rounded-full">안읽음</span>
                </div>
            </div>
        </div>

        <!-- Letter Card -->
        <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100 mb-4">
            <!-- Sender/Receiver Info -->
            <div class="flex items-center justify-between mb-4 pb-4 border-b border-gray-100">
                <div>
                    <p class="text-xs text-gray-500 mb-1">
                        <span th:if="${letter.isSender}">받는 사람</span>
                        <span th:if="${!letter.isSender}">보낸 사람</span>
                    </p>
                    <p class="text-base font-bold text-gray-900">
                        <span th:if="${letter.isSender}" th:text="${letter.receiverName}">수신자</span>
                        <span th:if="${!letter.isSender}" th:text="${letter.senderName}">발신자</span>
                    </p>
                </div>
                <div class="text-right">
                    <p class="text-xs text-gray-400" th:text="${letter.createdAt}">2024.11.04 14:30</p>
                    <p th:if="${letter.readAt}" class="text-xs text-gray-400 mt-1">
                        읽음: <span th:text="${letter.readAt}">2024.11.04 15:00</span>
                    </p>
                </div>
            </div>

            <!-- Title -->
            <h2 class="text-xl font-bold text-gray-900 mb-4" th:text="${letter.title}">편지 제목</h2>

            <!-- TTS Listen Button -->
            <button id="ttsButton" onclick="playTts()"
                    class="mb-4 w-full flex items-center justify-center gap-2 px-4 py-3
               bg-white text-gray-700 rounded-xl font-medium border border-gray-200 shadow-sm">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/>
                </svg>
                <span id="ttsButtonText">편지 음성으로 듣기</span>
            </button>

            <!-- Content -->
            <div class="text-gray-700 leading-relaxed whitespace-pre-wrap mb-4" th:text="${letter.content}">
                편지 내용이 여기에 표시됩니다.
                여러 줄로 작성된 내용도 그대로 표시됩니다.
            </div>

            <!-- Image -->
            <div th:if="${letter.signedImageUrl}" class="mb-4">
                <img th:src="${letter.signedImageUrl}" alt="편지 이미지"
                     class="w-full rounded-xl object-cover max-h-96">
            </div>

            <!-- Input Type Badge -->
            <div class="flex items-center gap-2 pt-4 border-t border-gray-100">
                <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
                <span class="text-xs text-gray-500">
                    <span th:if="${letter.inputType.name() == 'TEXT'}">텍스트로 작성됨</span>
                    <span th:if="${letter.inputType.name() == 'STT'}">음성으로 작성됨 (STT)</span>
                </span>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="space-y-3">
            <!-- Reply Button (받은 편지인 경우) -->
            <a th:if="${!letter.isSender && !letter.isCancelled}"
               th:href="@{/letter/new(receiverId=${letter.senderId})}"
               class="block w-full py-3 bg-[#F5BF76] text-white text-center rounded-xl font-medium hover:brightness-95 transition shadow-sm">
                답장하기
            </a>

            <!-- Cancel Button (5분 이내 보낸 편지만) -->
            <form th:if="${letter.isSender && letter.canCancel && !letter.isCancelled}"
                  th:action="@{/letter/cancel}" method="post"
                  onsubmit="event.preventDefault(); showCancelModal(this);">
                <input type="hidden" name="letterId" th:value="${letter.id}"/>
                <button type="submit"
                        class="w-full py-3 bg-orange-500 text-white text-center rounded-xl font-medium hover:bg-orange-600 transition shadow-sm">
                    전송 취소
                </button>
            </form>

            <!-- Delete Button -->
            <button onclick="showDeleteModal()"
                    class="w-full py-3 bg-white text-red-500 text-center rounded-xl font-medium border border-red-500 hover:bg-red-50 transition shadow-sm">
                삭제하기
            </button>

            <!-- Back to List Button -->
            <a th:href="@{/letter/list(type=${letter.isSender ? 'sent' : 'received'})}"
               class="block w-full py-3 bg-white text-gray-700 text-center rounded-xl font-medium border border-gray-200 hover:bg-gray-50 transition shadow-sm">
                목록으로
            </a>
        </div>
    </div>

    <!-- Delete Modal -->
    <div id="deleteModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50" onclick="closeDeleteModal(event)">
        <div class="bg-white rounded-2xl p-6 max-w-sm w-full mx-4 shadow-xl" onclick="event.stopPropagation()">
            <h3 class="text-lg font-bold text-gray-900 mb-2">편지 삭제</h3>
            <p class="text-gray-600 text-sm mb-6">정말 이 편지를 삭제하시겠습니까?<br>삭제된 편지는 복구할 수 없습니다.</p>
            <div class="flex gap-3">
                <button onclick="closeDeleteModal()"
                        class="flex-1 py-2.5 bg-gray-100 text-gray-700 rounded-xl font-medium hover:bg-gray-200 transition">
                    취소
                </button>
                <button onclick="confirmDelete()"
                        class="flex-1 py-2.5 bg-red-500 text-white rounded-xl font-medium hover:bg-red-600 transition">
                    삭제
                </button>
            </div>
        </div>
    </div>

    <!-- Cancel Modal -->
    <div id="cancelModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50" onclick="closeCancelModal(event)">
        <div class="bg-white rounded-2xl p-6 max-w-sm w-full mx-4 shadow-xl" onclick="event.stopPropagation()">
            <h3 class="text-lg font-bold text-gray-900 mb-2">전송 취소</h3>
            <p class="text-gray-600 text-sm mb-6">편지 전송을 취소하시겠습니까?<br>취소된 편지는 상대방이 볼 수 없습니다.</p>
            <div class="flex gap-3">
                <button onclick="closeCancelModal()"
                        class="flex-1 py-2.5 bg-gray-100 text-gray-700 rounded-xl font-medium hover:bg-gray-200 transition">
                    닫기
                </button>
                <button onclick="confirmCancel()"
                        class="flex-1 py-2.5 bg-orange-500 text-white rounded-xl font-medium hover:bg-orange-600 transition">
                    전송 취소
                </button>
            </div>
        </div>
    </div>


    <!-- JavaScript -->
    <script th:inline="javascript">
        const letterId = /*[[${letter.id}]]*/ 0;
        const isSender = /*[[${letter.isSender}]]*/ false;

        function showDeleteModal() {
            const modal = document.getElementById('deleteModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeDeleteModal(event) {
            if (event && event.target.id !== 'deleteModal') return;
            const modal = document.getElementById('deleteModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function confirmDelete() {
            fetch(`/letter/delete/${letterId}`, {
                method: 'POST'
            })
                .then(response => response.text())
                .then(result => {
                    if (result === 'success') {
                        closeDeleteModal();
                        window.location.href = `/letter/list?type=${isSender ? 'sent' : 'received'}`;
                    } else {
                        alert('삭제 중 오류가 발생했습니다.');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('삭제 중 오류가 발생했습니다.');
                });
        }

        // Close modal on ESC key
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                closeDeleteModal();
            }
        });

        let cancelForm = null;

        function showCancelModal(form) {
            cancelForm = form;
            const modal = document.getElementById('cancelModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeCancelModal(event) {
            if (event && event.target.id !== 'cancelModal') return;
            const modal = document.getElementById('cancelModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            cancelForm = null;
        }

        function confirmCancel() {
            if (cancelForm) {
                cancelForm.submit();
            }
        }

        // ESC 키로 모달 닫기
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                closeCancelModal();
            }
        });

        async function playTts() {
            const button = document.getElementById("ttsButton");
            const buttonText = document.getElementById("ttsButtonText");

            // 재생 중 상태
            buttonText.innerText = "재생 중...";
            button.disabled = true; // 재생 중 클릭 방지

            try {
                const res = await fetch(`/letter/api/tts/${letterId}`);
                const data = await res.json();

                const audioBase64 = data.audioBase64;

                if (!audioBase64) {
                    alert("음성 생성 실패!");
                    buttonText.innerText = "편지 음성으로 듣기";
                    button.disabled = false;
                    return;
                }

                const audio = new Audio("data:audio/mp3;base64," + audioBase64);
                audio.play();

                audio.onended = () => {
                    buttonText.innerText = "편지 음성으로 듣기";
                    button.disabled = false;
                };

                audio.onerror = () => {
                    alert("음성 재생 오류 발생!");
                    buttonText.innerText = "편지 음성으로 듣기";
                    button.disabled = false;
                };

            } catch (err) {
                console.error(err);
                alert("음성 생성 중 오류 발생!");
                buttonText.innerText = "편지 음성으로 듣기";
                button.disabled = false;
            }
        }

    </script>

</th:block>
</html>
