<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="fragments/layout :: AppLayout('home', ~{::content}, null)">

<th:block th:fragment="content">

    <!-- 로그인 사용자 전용 -->
    <div class="flex flex-col px-5 pt-6 w-full" th:if="${member != null}">
        <!-- 프로필 영역 -->
        <div class="flex items-center gap-4">
            <!-- 원형 프로필 이미지 (없으면 기본 이미지로 대체) -->
            <img class="h-20 w-20 rounded-full object-cover"
                 th:src="${member.picture}"
                 alt="profile" />

            <div class="flex flex-col">
                <p class="text-[18px] font-bold text-gray-900"
                   th:text="${member.name + '님'}" />
                <p class="text-[13px] text-gray-500"
                   th:text="${member.email}" />
            </div>
        </div>

        <!-- 구분선 -->
        <div class="my-8 h-[2px] w-full bg-gray-100"></div>

        <!-- 버튼들 -->
        <div class="flex flex-col items-center gap-5">
            <!-- 로그아웃 -->
            <form th:action="@{/auth/logout}" method="post" class="w-full">
                <button type="submit"
                        class="mx-auto block w-[200px] rounded-full bg-[#F5BF76] px-6 py-3 text-center text-[14px] font-semibold text-gray-900 shadow-md">
                    로그아웃
                </button>
            </form>

            <!-- 가족탈퇴 -->
            <a th:href="@{/member/family/leave}"
               class="mx-auto block w-[200px] rounded-full bg-white px-6 py-3 text-center text-[14px] font-semibold text-gray-900 shadow-md">
                가족탈퇴
            </a>

            <!-- 회원탈퇴 -->
            <form th:action="@{/api/member}" method="post"
                  onsubmit="return confirm('정말 탈퇴하시겠어요?');">
                <input type="hidden" name="_method" value="delete" />
                <button type="submit"
                        class="mx-auto block w-[200px] rounded-full bg-white px-6 py-3 text-center text-[14px] font-semibold text-gray-400 shadow-md">
                    회원탈퇴
                </button>
            </form>
        </div>
    </div>

    <!-- 비로그인 사용자 -->
    <section class="px-5 py-10 text-center" th:if="${member == null}">
        <p class="text-sm text-gray-600">로그인이 필요합니다.</p>
        <a th:href="@{/oauth2/authorization/kakao}"
           class="mx-auto mt-4 inline-block rounded-full bg-amber-300 px-6 py-3 text-[14px] font-semibold text-gray-900 shadow-md">
            카카오로 로그인
        </a>
    </section>

</th:block>


</html>
