<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="fragments/layout :: AppLayout('home', ~{::content}, null)">

<th:block th:fragment="content">

    <!-- 로그인 사용자 전용 -->
    <div class="flex flex-col px-5 pt-6 w-full" th:if="${member != null}">
        <!-- 프로필 영역 -->
        <a th:href="@{/member/mypage}" class="flex items-center gap-4">
            <img class="h-20 w-20 rounded-full object-cover"
                 th:src="${member.picture}"
                 alt="profile" />

            <div class="flex flex-col">
                <p class="text-[18px] font-bold text-gray-900"
                   th:text="${member.name + '님'}" />
                <p class="text-[13px] text-gray-500"
                   th:text="${member.email}" />
            </div>
        </a>

        <!-- 구분선 -->
        <div class="my-8 h-[2px] w-full bg-gray-100"></div>

        <div class="flex items-center justify-between pl-5">
            <p class="text-[20px] font-extrabold text-gray-900">가족목록</p>
            <a th:href="@{/member/invite}"
               class="flex items-center gap-1 bg-white py-1 text-[13px] font-semibold text-amber-800">
                <span>가족 초대</span>
                <img src="/svgs/ic_plus_btn.svg" alt="plus btn" />
            </a>
        </div>

        <div class="mt-4 flex flex-col gap-4 pb-36 items-center">
            <div>
                <img src="/svgs/family.svg" alt="invite family" />
            </div>
            <div class="flex flex-col w-full gap-3">
                <a th:href="@{/member/code}"
                   class="flex flex-row w-full items-center justify-center
                    font-bold
                    rounded-2xl shadow-[0_0_10px_rgba(0,0,0,0.08)] p-3">
                    가족 모임 만들기
                </a>
                <button id="openInviteModal" type="button"
                        class="flex flex-row w-full items-center justify-center
                       font-bold
                       rounded-2xl shadow-[0_0_10px_rgba(0,0,0,0.08)] p-3 bg-[#FFB755]">
                    초대 코드 입력하기
                </button>
            </div>
        </div>


    </div>



    <!-- 비로그인 사용자 -->
    <section class="px-5 py-10 text-center" th:if="${member == null}">
        <p class="text-sm text-gray-600">로그인이 필요합니다.</p>
        <a th:href="@{/oauth2/authorization/kakao}"
           class="mx-auto mt-4 inline-block rounded-full bg-amber-300 px-6 py-3 text-[14px] font-semibold text-gray-900 shadow-md">
            카카오로 로그인
        </a>
    </section>

    <th:block th:replace="~{fragments/inputModal :: inputModal('초대 코드를 입력하세요', '확인', '취소')}" />

    <script>
        (function () {
            const modal = document.getElementById('inputModal');   // 프래그먼트 모달
            const form  = document.getElementById('submitForm');   // 프래그먼트 form
            const input = document.getElementById('input');        // 프래그먼트 input
            const openBtn = document.getElementById('openInviteModal');

            // 모달 열기/닫기 (닉네임 모달과 동일 스타일)
            function openModal() {
                modal.classList.remove('hidden');
                document.body.style.overflow = 'hidden';
                input.value = '';
                input.placeholder = '초대 코드를 입력하세요';
                setTimeout(() => input.focus(), 0);
            }
            function closeModal() {
                modal.classList.add('hidden');
                document.body.style.overflow = '';
            }

            // 트리거
            openBtn.addEventListener('click', openModal);

            const closeButtons = modal.querySelectorAll('[data-modal-close]');
            closeButtons.forEach(b => b.addEventListener('click', closeModal));

            modal.addEventListener('click', (e) => {
                if (e.target === modal) closeModal();
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && !modal.classList.contains('hidden')) closeModal();
            });

            // 초대 코드로 가족 참가 (닉네임 모달과 동일한 패턴)
            form.addEventListener('submit', async (e) => {
                e.preventDefault();

                const code = input.value.trim();
                if (!code) {
                    alert('초대 코드를 입력해주세요.');
                    input.focus();
                    return;
                }

                const token =
                    document.querySelector('meta[name="_csrf"]')?.content ||
                    document.querySelector('input[name="_csrf"]')?.value;

                try {
                    const res = await fetch('/api/family/join', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            ...(token ? { 'X-CSRF-TOKEN': token } : {}),
                        },
                        body: JSON.stringify({ inviteCode: code })
                    });

                    if (res.ok) {
                        closeModal();
                        window.location.href = '/member/family';
                        return;
                    }

                    let msg = '초대 코드 확인에 실패했습니다.';
                    try {
                        const data = await res.json();
                        if (data?.message) msg = data.message;
                    } catch (_) {}
                    alert(msg);
                } catch (err) {
                    console.error(err);
                    alert('서버 오류가 발생했습니다.');
                }
            });
        })();
    </script>


</th:block>


</html>
