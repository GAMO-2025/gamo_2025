<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<th:block th:replace="~{fragments/callLayout :: CallLayout(null, ~{::content}, ~{::script})}">
    <th:block th:fragment="content">
        <script src="https://cdn.webrtc-experiment.com/RecordRTC.js"></script>

        <div class="relative w-full max-w-md h-screen bg-gray-900 overflow-hidden mx-auto">
            <video id="remoteVideo" autoplay playsinline class="w-full h-full object-cover"></video>

            <div class="absolute top-0 left-0 right-0 flex flex-row items-center gap-3 px-4 py-3 bg-black bg-opacity-40 z-20">
                <img th:src="${target.profileImage()}" alt="profile" class="w-10 h-10 rounded-full object-cover">
                <h1 class="text-base font-semibold text-white" th:text="${target.nickname()}">닉네임</h1>
            </div>

            <video id="localVideo" autoplay playsinline muted
                   class="absolute top-16 right-4 w-24 h-32 rounded-lg border-2 border-white shadow-lg object-cover z-10"></video>

            <div class="absolute bottom-8 left-0 right-0 flex justify-center items-center gap-3 z-20 px-4">
                <button id="muteBtn" class="bg-gray-700 bg-opacity-80 hover:bg-gray-600 p-3 rounded-full">
                    <img th:src="@{/svgs/volume-mute.svg}" alt="mute" class="w-6 h-6">
                </button>
                <button id="cameraBtn" class="bg-gray-700 bg-opacity-80 hover:bg-gray-600 p-3 rounded-full">
                    <img th:src="@{/svgs/camera.svg}" alt="camera" class="w-6 h-6">
                </button>
                <button id="switchBtn" class="bg-gray-700 bg-opacity-80 hover:bg-gray-600 p-3 rounded-full">
                    <img th:src="@{/svgs/camera-reverse.svg}" alt="switch" class="w-6 h-6">
                </button>
                <button id="endBtn" class="px-5 py-2 rounded-full text-amber-700 font-semibold hover:opacity-90 transition"
                        style="background: linear-gradient(135deg, #FFDEB2 72%, #FFF9F2 100%);">
                    종료
                </button>
            </div>
        </div>

        <div id="downloadLink" class="mt-6"></div>
    </th:block>

    <th:block th:fragment="script">
        <script th:inline="javascript">
            /*<![CDATA[*/

            const userId = window.currentUserId || /*[[${userId}]]*/ null;
            const targetId = /*[[${targetId}]]*/ null;

            if (!userId || !targetId) {
                console.error('videocall: userId or targetId is null');
                alert('유효하지 않은 사용자입니다.');
                window.location.href = '/call';
            }

            console.log('videocall: userId=' + userId + ', targetId=' + targetId);

            // getUserMedia 지원 확인
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                console.error('videocall: getUserMedia is not supported');
                const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
                if (isIOS) {
                    alert('iOS에서는 Safari의 설정 > 웹사이트 설정 > 카메라/마이크를 허용해야 합니다.');
                } else {
                    alert('이 브라우저는 카메라/마이크를 지원하지 않습니다. Chrome이나 Firefox를 사용해주세요.');
                }
                window.location.href = '/call';
            }

            console.log('videocall: getUserMedia is supported');

            const isInitiator = userId < targetId;
            console.log('videocall: isInitiator=' + isInitiator);

            let pc;
            let localStream;
            let remoteStream;
            let currentCamera = 'user';
            let recorder;
            let audioTracks = [];
            let videoTracks = [];
            let isWebRTCInitialized = false;
            let isCallEnding = false;
            let recordingStarted = false;

            async function initWebRTC() {
                if (isWebRTCInitialized) {
                    console.log('videocall: WebRTC already initialized');
                    return;
                }
                isWebRTCInitialized = true;

                try {
                    console.log('videocall: Initializing WebRTC...');

                    // Step 1: 카메라/마이크 권한 요청
                    console.log('videocall: Requesting camera/mic access with facingMode=' + currentCamera);

                    localStream = await navigator.mediaDevices.getUserMedia({
                        audio: {
                            echoCancellation: true,
                            noiseSuppression: true
                        },
                        video: {
                            facingMode: currentCamera,
                            width: { ideal: 1280 },
                            height: { ideal: 720 }
                        }
                    });

                    console.log('videocall: Media devices granted - localStream obtained');

                    // Step 2: RTCPeerConnection 생성
                    pc = new RTCPeerConnection({
                        iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
                    });

                    console.log('videocall: RTCPeerConnection created');

                    // Step 3: 로컬 비디오에 스트림 표시
                    document.getElementById("localVideo").srcObject = localStream;
                    console.log('videocall: Local video element set');

                    // Step 4: 오디오/비디오 트랙 추출
                    audioTracks = localStream.getAudioTracks();
                    videoTracks = localStream.getVideoTracks();
                    console.log('videocall: Audio tracks=' + audioTracks.length + ', Video tracks=' + videoTracks.length);

                    // Step 5: 트랙을 PeerConnection에 추가
                    localStream.getTracks().forEach(track => {
                        pc.addTrack(track, localStream);
                        console.log('videocall: Added track to PeerConnection - kind=' + track.kind);
                    });

                    //  원격 트랙 수신 처리
                    pc.ontrack = (event) => {
                        console.log('videocall: Remote track received - kind=' + event.track.kind);
                        remoteStream = event.streams[0];
                        document.getElementById("remoteVideo").srcObject = remoteStream;
                        console.log('videocall: Remote video element set');
                        // 한쪽만 녹음을 진행
                        if (!recordingStarted && isInitiator) {
                            console.log('videocall: Remote stream ready, starting recording');
                            startRecordingNow();
                            recordingStarted = true;
                        } else if (!recordingStarted && !isInitiator) {
                            console.log('videocall: I am RECEIVER - not recording');
                        }
                    };

                    // ICE Candidate 처리
                    pc.onicecandidate = (event) => {
                        if (event.candidate) {
                            console.log('videocall: ICE candidate generated');
                            sendMessage({
                                type: 'CANDIDATE',
                                payload: {
                                    from: userId,
                                    to: targetId,
                                    candidate: event.candidate
                                }
                            });
                        }
                    };

                    console.log('videocall: WebRTC initialized successfully');

                } catch (error) {
                    console.error('videocall: Error initializing WebRTC');
                    console.error('videocall: Error name=' + error.name);
                    console.error('videocall: Error message=' + error.message);

                    // 에러 유형별 처리
                    if (error.name === 'NotAllowedError') {
                        console.error('videocall: User denied camera/mic permission');
                        alert('카메라와 마이크 접근을 거부했습니다.\n브라우저 설정에서 허용해주세요.');
                    } else if (error.name === 'NotFoundError') {
                        console.error('videocall: No camera/mic found');
                        alert('카메라 또는 마이크가 연결되지 않았습니다.');
                    } else if (error.name === 'NotReadableError') {
                        console.error('videocall: Camera/mic is already in use');
                        alert('카메라가 다른 앱에서 사용 중입니다.\n다른 앱을 종료 후 다시 시도해주세요.');
                    } else if (error.name === 'SecurityError') {
                        console.error('videocall: Security error - HTTPS required');
                        alert('HTTPS 연결이 필요합니다.\nhttps://192.168.55.83:8080 으로 접근해주세요.');
                    } else {
                        console.error('videocall: Unknown error');
                        alert('카메라/마이크 접근 실패:\n' + error.message);
                    }

                    isWebRTCInitialized = false;
                    window.location.href = '/call';
                }
            }

            function sendMessage(message) {
                const socket = window.globalCallSocket;
                if (socket && socket.readyState === WebSocket.OPEN) {
                    socket.send(JSON.stringify(message));
                    console.log('videocall: Message sent - type=' + message.type);
                    return true;
                } else {
                    console.error('videocall: WebSocket not connected, state=' + (socket?.readyState));
                    return false;
                }
            }

            let pendingCandidates = [];

            window.handleWebRTCMessage = async function(data) {
                const { type, payload } = data;
                console.log('videocall: Received message - type=' + type);

                if (isCallEnding) {
                    console.log('videocall: Call is ending, ignoring message');
                    return;
                }

                try {
                    switch(type) {
                        case 'OFFER': {
                            console.log('videocall: Processing OFFER');

                            if (!isWebRTCInitialized) {
                                console.log('videocall: WebRTC not initialized, initializing now...');
                                await initWebRTC();
                            }

                            if (pc.signalingState !== 'stable') {
                                console.warn('videocall: Unexpected state for OFFER, state=' + pc.signalingState);
                                return;
                            }

                            const offer = payload.offer;

                            if (!offer || !offer.type || !offer.sdp) {
                                console.error('videocall: Invalid OFFER format');
                                return;
                            }

                            await pc.setRemoteDescription(new RTCSessionDescription(offer));
                            console.log('videocall: Remote description set from OFFER');

                            await addPendingCandidates();
                            console.log('videocall: Added pending candidates count=' + pendingCandidates.length);
                            pendingCandidates = [];

                            const answer = await pc.createAnswer();
                            await pc.setLocalDescription(new RTCSessionDescription(answer));
                            console.log('videocall: Local description set with ANSWER');

                            sendMessage({
                                type: 'ANSWER',
                                payload: {
                                    from: userId,
                                    to: targetId,
                                    answer: answer
                                }
                            });
                            console.log('videocall: ANSWER sent');
                            break;
                        }

                        case 'ANSWER': {
                            console.log('videocall: Processing ANSWER, signaling state=' + pc.signalingState);

                            if (pc.signalingState !== 'have-local-offer') {
                                console.warn('videocall: Invalid state for ANSWER, state=' + pc.signalingState);
                                return;
                            }

                            const answer = payload.answer;

                            if (!answer || !answer.type || !answer.sdp) {
                                console.error('videocall: Invalid ANSWER format');
                                return;
                            }

                            await pc.setRemoteDescription(new RTCSessionDescription(answer));
                            console.log('videocall: Remote description set from ANSWER');

                            await addPendingCandidates();
                            console.log('videocall: Added pending candidates count=' + pendingCandidates.length);
                            pendingCandidates = [];
                            break;
                        }

                        case 'CANDIDATE': {
                            if (!payload.candidate) {
                                console.warn('videocall: Empty ICE candidate');
                                return;
                            }

                            const signalingState = pc?.signalingState || 'unknown';
                            console.log('videocall: Received CANDIDATE, signaling state=' + signalingState);

                            if (signalingState === 'stable' || signalingState === 'have-remote-offer' || signalingState === 'have-local-offer') {
                                try {
                                    await pc.addIceCandidate(new RTCIceCandidate(payload.candidate));
                                    console.log('videocall: ICE candidate added immediately');
                                } catch (e) {
                                    if (e.name === 'InvalidStateError') {
                                        console.warn('videocall: Cannot add ICE candidate - invalid state, buffering');
                                        pendingCandidates.push(payload.candidate);
                                    } else if (e.name === 'InvalidAccessError') {
                                        console.warn('videocall: Duplicate or invalid ICE candidate');
                                    } else {
                                        console.error('videocall: Error adding ICE candidate - ' + e.message);
                                    }
                                }
                            } else {
                                console.log('videocall: State not ready for candidate, buffering');
                                pendingCandidates.push(payload.candidate);
                            }
                            break;
                        }

                        case 'END_CALL':
                            console.log('videocall: Remote END_CALL received');
                            closeCallWithRedirect('상대방이 통화를 종료했습니다.');
                            break;

                        default:
                            console.warn('videocall: Unknown message type - ' + type);
                    }
                } catch (error) {
                    console.error('videocall: Error handling WebRTC message - ' + error.message);
                }
            };

            async function addPendingCandidates() {
                console.log('videocall: Adding pending candidates count=' + pendingCandidates.length);

                for (let candidate of pendingCandidates) {
                    try {
                        await pc.addIceCandidate(new RTCIceCandidate(candidate));
                    } catch (e) {
                        console.error('videocall: Error adding pending candidate - ' + e.message);
                    }
                }
            }

            async function startCall() {
                console.log('videocall: Checking WebSocket...');

                while (!window.globalCallSocket || window.globalCallSocket.readyState !== WebSocket.OPEN) {
                    console.log('videocall: Waiting for WebSocket to be ready...');
                    await new Promise(resolve => setTimeout(resolve, 100));
                }

                console.log('videocall: Starting call...');

                await initWebRTC();

                const offer = await pc.createOffer();
                await pc.setLocalDescription(new RTCSessionDescription(offer));
                console.log('videocall: Local description set with OFFER');

                sendMessage({
                    type: 'OFFER',
                    payload: {
                        from: userId,
                        to: targetId,
                        offer: offer
                    }
                });
                console.log('videocall: OFFER sent');
            }
            function mergeAudioStreams(localStream, remoteStream) {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();

                const localSource = audioContext.createMediaStreamSource(localStream);
                const remoteSource = audioContext.createMediaStreamSource(remoteStream);

                // Gain 노드 생성 (음량 조절)
                const localGain = audioContext.createGain();
                const remoteGain = audioContext.createGain();

                // 각각의 음량을 1.0으로 설정
                localGain.gain.value = 1.0;
                remoteGain.gain.value = 1.0;

                // 소스를 Gain에 연결
                localSource.connect(localGain);
                remoteSource.connect(remoteGain);

                // 목적지 생성 (섞인 오디오 출력)
                const destination = audioContext.createMediaStreamDestination();

                // Gain을 목적지에 연결 (중요!)
                localGain.connect(destination);
                remoteGain.connect(destination);

                console.log('videocall: Audio streams merged - destination tracks:', destination.stream.getTracks().length);
                console.log('videocall: Audio streams merged - audio tracks:', destination.stream.getAudioTracks().length);

                return destination.stream;
            }

            async function startRecordingNow() {
                if (!localStream) {
                    console.warn('videocall: Local stream not ready for recording');
                    return;
                }

                if (!remoteStream) {
                    console.warn('videocall: Remote stream not ready yet, waiting...');
                    return;
                }

                if (typeof RecordRTC === 'undefined') {
                    console.error('videocall: RecordRTC library not loaded');
                    return;
                }

                try {
                    console.log('videocall: Starting to record both local and remote audio');

                    // 1. 로컬 트랙 확인
                    const localAudioTracks = localStream.getAudioTracks();
                    console.log('videocall: Local audio tracks count=' + localAudioTracks.length);

                    // 2. 원격 트랙 확인
                    const remoteAudioTracks = remoteStream.getAudioTracks();
                    console.log('videocall: Remote audio tracks count=' + remoteAudioTracks.length);

                    if (localAudioTracks.length === 0 || remoteAudioTracks.length === 0) {
                        console.error('videocall: ERROR - No audio tracks available');
                        return;
                    }

                    // 3. 두 오디오를 Gain으로 섞기
                    const mergedAudio = mergeAudioStreams(localStream, remoteStream);
                    console.log('videocall: Merged audio tracks count=' + mergedAudio.getTracks().length);
                    console.log('videocall: Merged audio audio-tracks count=' + mergedAudio.getAudioTracks().length);

                    // 4. 섞인 오디오만 담기
                    const recordingTracks = [];
                    recordingTracks.push(...mergedAudio.getAudioTracks());

                    const mixedStream = new MediaStream(recordingTracks);

                    console.log('videocall: Final recording stream tracks count=' + mixedStream.getTracks().length);

                    if (mixedStream.getTracks().length === 0) {
                        console.error('videocall: ERROR - No tracks in final stream');
                        return;
                    }

                    // 5. RecordRTC로 녹음 시작
                    recorder = RecordRTC(mixedStream, {
                        type: 'audio',
                        mimeType: 'audio/webm',
                        recorderType: RecordRTC.MediaStreamRecorder,
                        bitsPerSecond: 128000
                    });

                    recorder.startRecording();
                    console.log('videocall: Recording started - both local and remote audio mixed');

                } catch (e) {
                    console.error('videocall: Error starting recording - ' + e.message);
                    console.error('videocall: Error stack - ' + e.stack);
                }
            }
            function stopRecording() {
                return new Promise((resolve) => {
                    if (!recorder) {
                        console.log('videocall: No recorder, skipping');
                        resolve();
                        return;
                    }

                    recorder.stopRecording(async () => {
                        try {
                            const blob = recorder.getBlob();

                            console.log('videocall: DEBUG - Blob size=' + blob.size + ' bytes');
                            console.log('videocall: DEBUG - Blob type=' + blob.type);

                            if (blob.size === 0) {
                                console.warn('videocall: WARNING - Blob is empty, no recording data was captured');
                                resolve();
                                return;
                            }

                            const formData = new FormData();
                            formData.append('voiceFile', blob, 'call_recording_' + userId + '_' + targetId + '.webm');

                            console.log('videocall: Sending recording to STT');

                            // TODO: 서버 주소 환경변수로 관리 필요
                            const response = await fetch('http://localhost:8080/letter/api/videocall/stt', {
                                method: 'POST',
                                body: formData
                            });

                            console.log('videocall: DEBUG - STT response status=' + response.status);

                            if (!response.ok) {
                                console.error('videocall: STT failed - ' + response.statusText);
                                resolve();
                                return;
                            }

                            console.log('videocall: STT conversion complete');
                            resolve();

                        } catch (e) {
                            console.error('videocall: Error saving recording - ' + e.message);
                            resolve();
                        }
                    });
                });
            }

            async function closeCallWithRedirect(message) {
                if (isCallEnding) {
                    console.log('videocall: Call already ending, ignoring request');
                    window.location.href = "/call";
                    return;
                }

                isCallEnding = true;
                console.log('videocall: Closing call - ' + message);

                const sent = sendMessage({
                    type: 'END_CALL',
                    payload: {
                        from: userId,
                        to: targetId
                    }
                });

                if (!sent) {
                    console.error('videocall: Failed to send END_CALL');
                }

                console.log('videocall: Waiting for recording to stop...');
                await stopRecording();
                console.log('videocall: Recording stopped');

                if (localStream) {
                    localStream.getTracks().forEach(track => track.stop());
                    console.log('videocall: Local stream tracks stopped');
                }
                if (remoteStream) {
                    remoteStream.getTracks().forEach(track => track.stop());
                    console.log('videocall: Remote stream tracks stopped');
                }
                if (pc) {
                    pc.close();
                    console.log('videocall: PeerConnection closed');
                }

                setTimeout(() => {
                    alert(message);
                    window.location.href = "/call";
                }, 300);
            }

            document.getElementById("muteBtn").addEventListener("click", () => {
                if (audioTracks.length === 0) {
                    console.warn('videocall: No audio tracks available');
                    return;
                }

                const audioTrack = audioTracks[0];
                audioTrack.enabled = !audioTrack.enabled;

                const muteBtn = document.getElementById("muteBtn");
                muteBtn.style.opacity = audioTrack.enabled ? '1' : '0.5';
                console.log('videocall: Audio ' + (audioTrack.enabled ? 'enabled' : 'disabled'));
            });

            document.getElementById("cameraBtn").addEventListener("click", () => {
                if (videoTracks.length === 0) {
                    console.warn('videocall: No video tracks available');
                    return;
                }

                const videoTrack = videoTracks[0];
                videoTrack.enabled = !videoTrack.enabled;

                const cameraBtn = document.getElementById("cameraBtn");
                cameraBtn.style.opacity = videoTrack.enabled ? '1' : '0.5';
                console.log('videocall: Video ' + (videoTrack.enabled ? 'enabled' : 'disabled'));
            });

            document.getElementById("switchBtn").addEventListener("click", async () => {
                try {
                    console.log('videocall: Switching camera...');
                    currentCamera = currentCamera === 'user' ? 'environment' : 'user';
                    console.log('videocall: New camera mode=' + currentCamera);

                    const newStream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: currentCamera },
                        audio: true
                    });

                    const videoTrack = newStream.getVideoTracks()[0];
                    const sender = pc.getSenders().find(s => s.track.kind === 'video');

                    if (sender) {
                        await sender.replaceTrack(videoTrack);
                        console.log('videocall: Video track replaced');
                    }

                    document.getElementById("localVideo").srcObject = newStream;
                    console.log('videocall: Local video element updated');

                    localStream.getTracks().forEach(track => track.stop());
                    localStream = newStream;
                    audioTracks = newStream.getAudioTracks();
                    videoTracks = newStream.getVideoTracks();

                    console.log('videocall: Camera switched successfully to ' + currentCamera);
                } catch (error) {
                    console.error('videocall: Error switching camera - ' + error.message);
                    alert('카메라 전환에 실패했습니다.');
                }
            });

            document.getElementById("endBtn").addEventListener("click", () => {
                console.log('videocall: End button clicked');
                closeCallWithRedirect('통화가 종료되었습니다.');
            });

            if (isInitiator) {
                console.log('videocall: I am INITIATOR, sending OFFER');
                startCall();
            } else {
                console.log('videocall: I am RECEIVER, waiting for OFFER');
            }
            /*]]>*/
        </script>
    </th:block>
</th:block>
</html>
