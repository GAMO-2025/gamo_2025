<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: AppLayout('videocall', ~{::content}, null)}">
<th:block th:fragment="content">
    <head>
        <meta charset="UTF-8">
        <title>영상 통화 연결 중...</title>
        <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body class="bg-gray-900 text-white flex flex-col items-center justify-center h-screen">

    <!-- 전화 거는 중 -->
    <div th:if="${mode == 'calling'}" id="calling" class="hidden text-center">
        <div class="animate-spin rounded-full h-24 w-24 border-8 border-gray-700 border-t-blue-500 mb-6"></div>
        <h2 class="text-2xl font-semibold mb-2" th:text="${target.nickname()} + '님에게 전화를 거는 중입니다.'"></h2>
        <p class="text-gray-400">전화 거는 중</p>
        <button onclick="cancelCall()" class="mt-6 px-4 py-2 rounded-lg font-semibold"
                style="background: linear-gradient(135deg, #FFDEB2 72%, #FFF9F2 100%);">통화 취소</button>
    </div>

    <!-- 전화 받는 화면 -->
    <div th:if="${mode == 'incoming'}" id="incoming" class="hidden text-center">
        <h2 class="text-2xl font-semibold mb-3" th:text="${caller.nickname()} + '님이 전화 중입니다.'">전화가 왔습니다.</h2>
        <div class="flex justify-center space-x-6 mt-6">
            <button onclick="acceptCall()" class="mt-6 px-4 py-2 rounded-lg font-semibold"
                    style="background: linear-gradient(135deg, #FFDEB2 72%, #FFF9F2 100%);">수락</button>
            <button onclick="rejectCall()" class="mt-6 px-4 py-2 rounded-lg font-semibold"
                    style="background: linear-gradient(135deg, #FFDEB2 72%, #FFF9F2 100%);">거절</button>
        </div>
    </div>

    <!-- 전화 거절됨 / 부재중 -->
    <div th:if="${mode == 'rejected'}" id="rejected" class="hidden text-center">
        <div class="rounded-full bg-red-500/20 p-6 mb-4">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 text-red-400 mx-auto" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M18.364 5.636a9 9 0 010 12.728M5.636 18.364a9 9 0 010-12.728M15 9l-6 6m0-6l6 6" />
            </svg>
        </div>
        <h2 class="text-xl font-semibold mb-2">통화가 거절되었습니다.</h2>
        <p class="text-gray-400 mb-6">상대방이 전화를 받지 않았습니다.</p>
        <button onclick="goBack()" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded-lg font-semibold">돌아가기</button>
    </div>


    <th:block th:replace="~{fragments/alert-modal :: alertModal('commonAlert', '알림 메시지')}" />
    <th:block th:replace="~{fragments/action-modal :: actionModal('cancelConfirmModal', '정말 통화를 취소하시겠습니까?', '취소', '닫기')}" />

    <script th:inline="javascript">
        /*<![CDATA[*/
        const mode = /*[[${mode}]]*/ 'calling';
        const userId = /*[[${userId}]]*/ 1;
        const targetId = /*[[${targetId}]]*/ 2;

        let callTimeout;
        let socket;

        function handleSocketOpen() {
            console.log("loading: handleSocketOpen 실행");
            if (mode === 'calling') {
                const msg = {
                    type: "CALL_REQUEST",
                    payload: { from: userId, to: targetId }
                };
                socket.send(JSON.stringify(msg));
                console.log("loading: CALL_REQUEST 전송:", msg);

                callTimeout = setTimeout(() => {
                    openAlertModal('commonAlert', '상대방이 응답하지 않습니다.');
                    socket.close();
                    window.location.href = "/call";
                }, 90000);
            } else if (mode === 'incoming') {
                console.log("loading: incoming 모드 - CALL_REQUEST 보낼 필요 없음");
            }
        }

        function initSocket() {
            if (!window.globalCallSocket) {
                console.error("loading: globalCallSocket이 없습니다");
                return;
            }

            socket = window.globalCallSocket;
            console.log("loading: socket readyState=" + socket.readyState);

            socket.onopen = handleSocketOpen;

            socket.onmessage = event => {
                const data = JSON.parse(event.data);
                console.log("loading: 메시지 수신:", data);

                clearTimeout(callTimeout);

                switch (data.code) {
                    case "CALL_INCOMING":
                        console.log("loading: 전화가 왔습니다!");
                        break;

                    case "CALL_ACCEPTED":
                        console.log("loading: 상대방이 통화를 수락했습니다!");
                        const otherUserId = data.sender === userId ? data.receiver : data.sender;
                        window.location.href = `/call/videocall/${otherUserId}`;
                        break;

                    case "CALL_TIMEOUT":
                        openAlertModal('commonAlert', '통화 시간이 초과되었습니다.');
                        window.location.href = "/call";
                        break;

                    case "CALL_REJECTED":
                        openAlertModal('commonAlert', '상대방이 전화를 거절했습니다.');
                        alert("상대방이 전화를 거절했습니다.");
                        window.location.href = "/call";
                        break;

                    case "CALL_BUSY":
                        openAlertModal('commonAlert', '상대방이 통화 중입니다.');
                        window.location.href = "/call";
                        break;

                    case "CALL_CANCELLED":
                        openAlertModal('commonAlert', '상대방이 통화를 취소했습니다.');
                        window.location.href = "/call";
                        break;
                }
            };

            socket.onerror = (error) => {
                console.error("loading: WebSocket error:", error);
            };

            socket.onclose = () => {
                console.log("loading: WebSocket closed");
            };

            if (socket.readyState === WebSocket.OPEN) {
                console.log("loading: socket 이미 OPEN, onopen 수동 호출");
                handleSocketOpen();
            } else if (socket.readyState === WebSocket.CONNECTING) {
                console.log("loading: socket 연결 중, onopen 대기");
            } else if (socket.readyState === WebSocket.CLOSED) {
                console.error("loading: socket이 이미 닫혀있습니다");
                window.location.href = "/call";
            }
        }

        function sendMessage(type, payload) {
            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({ type, payload }));
                console.log("loading: Message sent -", type);
            } else {
                console.warn("loading: WebSocket not open. Cannot send:", type);
            }
        }

        function acceptCall() {
            sendMessage("CALL_ACCEPT", { from: userId, to: targetId });
            console.log("loading: CALL_ACCEPT 전송 완료");
            setTimeout(() => {
                window.location.href = `/call/videocall/${targetId}`;
            }, 200);
        }

        function rejectCall() {
            sendMessage("CALL_REJECT", { from: userId, to: targetId });
            console.log("loading: CALL_REJECT 전송 완료");
            setTimeout(() => {
                window.location.href = "/call";
            }, 200);
        }

        function cancelCall() {
            clearTimeout(callTimeout);

            openActionModal('cancelConfirmModal',
                '정말 통화를 취소하시겠습니까?',
                () => {
                    sendMessage("CALL_CANCEL", { from: userId, to: targetId });
                    window.location.href = "/call";
                }
            );
        }

        window.addEventListener("DOMContentLoaded", () => {
            document.querySelectorAll("div[id]").forEach(div => div.classList.add("hidden"));
            const modeElement = document.getElementById(mode);
            if (modeElement) {
                modeElement.classList.remove("hidden");
            }

            initSocket();
        });

        function goBack() {
            window.location.href = `/call/video-call/profile?partnerId=${targetId}`;
        }
        /*]]>*/
    </script>
    </body>
</th:block>
</html>
