<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: AppLayout('videocall', ~{::content}, null)}">
<th:block th:fragment="content">
    <head>
        <meta charset="UTF-8">
        <title>영상 통화 연결 중...</title>
        <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body class="bg-gray-900 text-white flex flex-col items-center justify-center h-screen">

    <div th:if="${mode == 'calling'}" id="calling" class="hidden text-center">
        <div class="animate-spin rounded-full h-24 w-24 border-8 border-gray-700 border-t-blue-500 mb-6"></div>
        <h2 class="text-2xl font-semibold mb-2" th:text="${target.nickname()} + '님에게 전화를 거는 중입니다.'"></h2>
        <p class="text-gray-400">전화 거는 중</p>
        <button onclick="cancelCall()" class="mt-6 px-4 py-2 rounded-lg font-semibold"
                style="background: linear-gradient(135deg, #FFDEB2 72%, #FFF9F2 100%);">통화 취소</button>
    </div>

    <div th:if="${mode == 'incoming'}" id="incoming" class="hidden text-center">
        <h2 class="text-2xl font-semibold mb-3" th:text="${caller.nickname()} + '님이 전화 중입니다.'">전화가 왔습니다.</h2>
        <div class="flex justify-center space-x-6 mt-6">
            <button onclick="acceptCall()" class="mt-6 px-4 py-2 rounded-lg font-semibold"
                    style="background: linear-gradient(135deg, #FFDEB2 72%, #FFF9F2 100%);">수락</button>
            <button onclick="rejectCall()" class="mt-6 px-4 py-2 rounded-lg font-semibold"
                    style="background: linear-gradient(135deg, #FFDEB2 72%, #FFF9F2 100%);">거절</button>
        </div>
    </div>

    <div th:if="${mode == 'rejected'}" id="rejected" class="hidden text-center">
        <div class="rounded-full bg-red-500/20 p-6 mb-4">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 text-red-400 mx-auto" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M18.364 5.636a9 9 0 010 12.728M5.636 18.364a9 9 0 010-12.728M15 9l-6 6m0-6l6 6" />
            </svg>
        </div>
        <h2 class="text-xl font-semibold mb-2">통화가 거절되었습니다.</h2>
        <p class="text-gray-400 mb-6">상대방이 전화를 받지 않았습니다.</p>
        <button onclick="goBack()" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded-lg font-semibold">돌아가기</button>
    </div>

    <th:block th:replace="~{fragments/alert-modal :: alertModal('commonAlert', '알림 메시지')}" />
    <th:block th:replace="~{fragments/action-modal :: actionModal('cancelConfirmModal', '정말 통화를 취소하시겠습니까?', '취소', '닫기')}" />

    <script th:inline="javascript">
        const mode = /*[[${mode}]]*/ 'calling';
        const userId = /*[[${userId}]]*/ 1;
        const targetId = /*[[${targetId}]]*/ 2;
        const targetNickname = /*[[${target?.nickname() ?: caller?.nickname() ?: '알 수 없는 사용자'}]]*/ '알 수 없는 사용자';

        let callTimeout;
        let socket;
        let isNavigating = false;

        function handleSocketOpen() {
            console.log("[loading-handleSocketOpen] 소켓 열림");
            if (mode === 'calling') {
                const msg = {
                    type: "CALL_REQUEST",
                    payload: { from: userId, to: targetId }
                };
                socket.send(JSON.stringify(msg));
                console.log("[loading-handleSocketOpen] CALL_REQUEST 전송");

                startCallTimeout();
            } else if (mode === 'incoming') {
                console.log("[loading-handleSocketOpen] incoming 모드");
            }
        }

        function startCallTimeout() {
            clearTimeout(callTimeout);
            callTimeout = setTimeout(() => {
                console.log("[loading-startCallTimeout] 통화 타임아웃 발생 (90초)");
                handleCallTimeout();
            }, 90000);
            console.log("[loading-startCallTimeout] 90초 타임아웃 설정됨");
        }

        function handleCallTimeout() {
            if (isNavigating) {
                console.log("[loading-handleCallTimeout] 이미 이동 중");
                return;
            }

            isNavigating = true;
            console.log("[loading-handleCallTimeout] 타임아웃 처리 시작");

            openAlertModal('commonAlert', '상대방이 응답하지 않습니다.');

            const alertButton = document.querySelector('[id="commonAlert"] button');
            if (alertButton) {
                alertButton.addEventListener('click', () => {
                    console.log("[loading-handleCallTimeout] 사용자가 모달 확인");
                    socket.close();
                    navigateAfterDelay('/call');
                }, { once: true });
            } else {
                navigateAfterDelay('/call');
            }
        }

        function navigateAfterDelay(url) {
            setTimeout(() => {
                console.log("[loading-navigateAfterDelay] " + url + "로 이동");
                window.location.href = url;
            }, 300);
        }

        function initSocket() {
            if (!window.globalCallSocket) {
                console.error("[loading-initSocket] globalCallSocket이 없음");
                return;
            }

            socket = window.globalCallSocket;
            console.log("[loading-initSocket] 소켓 상태 = " + socket.readyState);

            socket.onopen = handleSocketOpen;

            socket.onmessage = event => {
                const data = JSON.parse(event.data);
                console.log("[loading-onmessage] 메시지 수신 - type=" + data.type + ", message=" + data.message);

                clearTimeout(callTimeout);

                if (isNavigating) {
                    console.log("[loading-onmessage] 이미 이동 중, 무시");
                    return;
                }

                switch (data.type) {
                    case "CALL_INCOMING":
                        console.log("[loading-onmessage] CALL_INCOMING 수신");
                        break;

                    case "CALL_ACCEPTED":
                        console.log("[loading-onmessage] CALL_ACCEPTED 수신");
                        isNavigating = true;
                        navigateAfterDelay(`/call/videocall/${targetId}`);
                        break;

                    case "CALL_TIMEOUT":
                        console.log("[loading-onmessage] CALL_TIMEOUT 수신");
                        isNavigating = true;
                        handleCallTimeout();
                        break;

                    case "CALL_REJECTED":
                        console.log("[loading-onmessage] CALL_REJECTED 수신");
                        isNavigating = true;
                        openAlertModal('commonAlert', '상대방이 전화를 거절했습니다.');
                        setTimeout(() => {
                            navigateAfterDelay('/call');
                        }, 500);
                        break;

                    case "CALL_BUSY":
                        console.log("[loading-onmessage] CALL_BUSY 수신");
                        isNavigating = true;
                        openAlertModal('commonAlert', '상대방이 통화 중입니다.');
                        setTimeout(() => {
                            navigateAfterDelay('/call');
                        }, 500);
                        break;

                    case "CALL_CANCELLED":
                        console.log("[loading-onmessage] CALL_CANCELLED 수신");
                        isNavigating = true;
                        openAlertModal('commonAlert', '상대방이 통화를 취소했습니다.');
                        setTimeout(() => {
                            navigateAfterDelay('/call');
                        }, 500);
                        break;

                    default:
                        console.log("[loading-onmessage] 알 수 없는 메시지 타입 - " + data.type);
                }
            };

            socket.onerror = (error) => {
                console.error("[loading-onerror] 웹소켓 오류: " + error);
            };

            socket.onclose = () => {
                console.log("[loading-onclose] 웹소켓 닫힘");
                clearTimeout(callTimeout);
            };

            if (socket.readyState === WebSocket.OPEN) {
                console.log("[loading-initSocket] 소켓이 이미 OPEN");
                handleSocketOpen();
            } else if (socket.readyState === WebSocket.CONNECTING) {
                console.log("[loading-initSocket] 소켓 연결 대기 중");
            } else if (socket.readyState === WebSocket.CLOSED) {
                console.error("[loading-initSocket] 소켓이 이미 닫혀있음");
                isNavigating = true;
                navigateAfterDelay('/call');
            }
        }

        function sendMessage(type, payload) {
            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({ type, payload }));
                console.log("[loading-sendMessage] 메시지 전송 - type=" + type);
            } else {
                console.warn("[loading-sendMessage] 웹소켓 미연결 - type=" + type);
            }
        }

        function acceptCall() {
            console.log("[loading-acceptCall] 통화 수락");
            clearTimeout(callTimeout);
            isNavigating = true;
            sendMessage("CALL_ACCEPT", { from: userId, to: targetId });
            navigateAfterDelay(`/call/videocall/${targetId}`);
        }

        function rejectCall() {
            console.log("[loading-rejectCall] 통화 거절");
            clearTimeout(callTimeout);
            isNavigating = true;
            sendMessage("CALL_REJECT", { from: userId, to: targetId });
            navigateAfterDelay('/call');
        }

        function cancelCall() {
            console.log("[loading-cancelCall] 취소 확인 모달 열기");
            clearTimeout(callTimeout);

            openActionModal('cancelConfirmModal',
                '정말 통화를 취소하시겠습니까?',
                () => {
                    console.log("[loading-cancelCall] 취소 확인됨");
                    isNavigating = true;
                    sendMessage("CALL_CANCEL", { from: userId, to: targetId });
                    navigateAfterDelay('/call');
                }
            );
        }

        window.addEventListener("DOMContentLoaded", () => {
            console.log("[loading-DOMContentLoaded] 페이지 로드됨, mode=" + mode);
            document.querySelectorAll("div[id]").forEach(div => div.classList.add("hidden"));
            const modeElement = document.getElementById(mode);
            if (modeElement) {
                modeElement.classList.remove("hidden");
            }

            initSocket();
        });

        function goBack() {
            console.log("[loading-goBack] 뒤로가기");
            isNavigating = true;
            navigateAfterDelay(`/call/video-call/profile?partnerId=${targetId}`);
        }
    </script>
    </body>
</th:block>
</html>
