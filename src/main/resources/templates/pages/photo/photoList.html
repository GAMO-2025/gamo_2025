<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="fragments/layout :: AppLayout('photo', ~{::content}, null)">

<th:block th:fragment="content">
    <section class="grid grid-cols-4 gap-1" id="pic-grid">
        <div class="bg-green-500 flex items-center justify-center text-white font-bold cursor-pointer text-6xl aspect-square"
             id="uploadDiv">
            <form th:action="@{/photo/new/}" method="post" enctype="multipart/form-data"
                  id="photoForm" style="display:none;">
                <input type="file" id="fileInput" name="image" accept="image/*" required/>
            </form>
            +
        </div>
        <div class="photo-item relative w-full aspect-square overflow-hidden" th:each="photo : ${photoList}">
            <a th:href="@{'/photo/' + ${photo.photoId}}" class="block w-full h-full">
                <img th:src="@{'/photo/file/' + ${photo.url}}"
                     alt="앨범 사진"
                     class="w-full h-full object-cover transition-transform duration-300 hover:scale-105" />
            </a>
        </div>
    </section>
    <!-- 모달 배경 -->
    <div id="albumModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <!-- 모달 박스 -->
        <div class="bg-white rounded-2xl shadow-lg p-8 w-96">
            <h2 class="text-xl font-bold mb-4 text-gray-800">새 앨범 만들기</h2>
            <form th:action="@{/album/new}" method="post" id="albumForm">
                <input type="text" name="albumTitle"
                       placeholder="앨범 이름을 입력하세요"
                       class="w-full border border-gray-300 rounded-lg p-2 mb-4 focus:outline-none focus:ring-2 focus:ring-green-400"
                       required />

                <div class="flex justify-end gap-3">
                    <button type="button" id="cancelModalBtn"
                            class="px-4 py-2 rounded-lg bg-gray-300 text-gray-800 hover:bg-gray-400">
                        취소
                    </button>
                    <button type="submit"
                            class="px-4 py-2 rounded-lg bg-green-500 text-white hover:bg-green-600">
                        앨범 만들기
                    </button>
                </div>
            </form>
        </div>
    </div>

</body>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const uploadDiv = document.getElementById('uploadDiv');
        const fileInput = document.getElementById('fileInput');
        const photoForm = document.getElementById('photoForm');

        const pathParts = window.location.pathname.split('/');
        const albumId = pathParts[pathParts.length - 1];
        photoForm.action = `/photo/new/${albumId}`;

        uploadDiv.addEventListener('click', () => {
            fileInput.click();
        });

        fileInput.addEventListener('change', () => {
            if(fileInput.files.length > 0){
                photoForm.submit();
            }
        });


    let page = 1;          // 첫 페이지(0)는 서버에서 이미 내려줌
    const size = 20;
    let isLoading = false;
    let isLast = false;
    const grid = document.getElementById("pic-grid");

    async function loadMorePhotos() {
        if (isLoading || isLast) return;
        isLoading = true;

        try {
            const response = await fetch(`/album/${albumId}/paged?page=${page}&size=${size}`);
            const pageData = await response.json();

            if (!pageData.content || pageData.content.length === 0) {
                isLast = true;
                return;
            }

            // 마지막 페이지인지 체크
            if (pageData.last === true) {
                isLast = true;
            }

            pageData.content.forEach(photo => {
                const div = document.createElement("div");
                div.className = "photo-item relative w-full aspect-square overflow-hidden";

                div.innerHTML = `
                    <a href="/photo/${photo.photo_id}" class="block w-full h-full">
                        <img src="${photo.url}"
                             alt="앨범 사진"
                             class="w-full h-full object-cover transition-transform duration-300 hover:scale-105"/>
                    </a>
                `;

                grid.appendChild(div);
            });

            page++; // 다음 페이지

        } catch (err) {
            console.error("무한 스크롤 오류:", err);
        } finally {
            isLoading = false;
        }
    }

    window.addEventListener("scroll", () => {
        const scrollPosition = window.innerHeight + window.scrollY;
        const documentHeight = document.body.offsetHeight;

        if (scrollPosition >= documentHeight - 400) {
            loadMorePhotos();
        }
    });

    });
</script>
</th:block>
</html>
