<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="fragments/layout :: AppLayout('home', ~{::content}, null)">

<th:block th:fragment="content">
    <div th:if="${successMessage}" th:text="${successMessage}" style="display:none;" id="flash-success"></div>
    <div th:if="${errorMessage}" th:text="${errorMessage}" style="display:none;" id="flash-error"></div>

    <section class="grid grid-cols-2 gap-2 p-4">
        <div th:each="album : ${albums}"
             class="relative rounded-2xl shadow-md h-40 overflow-hidden cursor-pointer">

            <div th:if="${album.thumbnailUrl != null}">
                <img th:src="@{'https://storage.cloud.google.com/gamo_bucket/photo/' + ${album.thumbnailUrl}}"
                     class="absolute inset-0 w-full h-full object-cover" alt="앨범 사진">
            </div>
            <div th:unless="${album.thumbnailUrl != null}"
                 class="absolute inset-0 w-full h-full bg-white"></div>


            <!-- 오버레이 + 앨범 제목 -->
            <a th:href="@{'/album/' + ${album.albumId}}"
               class="absolute inset-0 flex items-center justify-center bg-black/30 text-white text-lg font-bold">
                <span th:text="${album.title}">앨범 제목</span>
            </a>

            <!-- 옵션 버튼 -->
            <button type="button"
                    class="absolute bottom-0 right-0 bg-black/50 text-white rounded-full w-10 h-10 flex items-center justify-center hover:bg-black/70"
                    style="margin:3px; font-size:32px;"
                    th:onclick="'toggleMenu(\'menu-' + ${album.albumId} + '\')'">
                ···
            </button>

            <!-- 삭제 메뉴 (버튼 바로 위) -->
            <div th:id="'menu-' + ${album.albumId}"
                 class="hidden absolute bottom-12 right-0 bg-white shadow-md rounded p-2 z-50">
                <form th:action="@{/album/delete}" method="post">
                    <!-- albumId 전달 -->
                    <input type="hidden" name="albumId" th:value="${album.albumId}" />
                    <button type="submit" class="text-red-600 hover:text-red-800 font-bold">
                        삭제하기
                    </button>
                </form>
            </div>
        </div>
        <!--앨범 만들기-->
        <div class="bg-green-500 rounded-2xl shadow-md h-40 flex items-center justify-center text-white font-bold cursor-pointer text-6xl"
             id="openModalBtn">
            +
        </div>
    </section>
    <div id="albumModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <!-- 모달 박스 -->
        <div class="bg-white rounded-2xl shadow-lg p-8 w-96">
            <h2 class="text-xl font-bold mb-4 text-gray-800">앨범 만들기</h2>
            <form th:action="@{/album/new}" method="post" id="albumForm">
                <input type="text" name="newTitle"
                       placeholder="앨범 이름을 입력하세요"
                       class="w-full border border-gray-300 rounded-lg p-2 mb-4 focus:outline-none focus:ring-2 focus:ring-green-400"
                       required />

                <div class="flex justify-end gap-3">
                    <button type="button" id="cancelModalBtn"
                            class="px-4 py-2 rounded-lg bg-gray-300 text-gray-800 hover:bg-gray-400">
                        취소
                    </button>
                    <button type="submit"
                            class="px-4 py-2 rounded-lg bg-green-500 text-white hover:bg-green-600">
                        추가
                    </button>
                </div>
            </form>
        </div>
    </div>

</body>
<script>
    function toggleMenu(id) {
        const menu = document.getElementById(id);
        if (menu.classList.contains('hidden')) {
            menu.classList.remove('hidden');
        } else {
            menu.classList.add('hidden');
        }
    }

    // 화면 클릭 시 메뉴 닫기
    document.addEventListener('click', function(event) {
        document.querySelectorAll('[id^="menu-"]').forEach(menu => {
            if (!menu.contains(event.target) && !menu.previousElementSibling.contains(event.target)) {
                menu.classList.add('hidden');
            }
        });
    });

    document.addEventListener("DOMContentLoaded", () => {
        <!-- 모달 스크립트 -->
        const modal = document.getElementById("albumModal");
        const openBtn = document.getElementById("openModalBtn");
        const cancelBtn = document.getElementById("cancelModalBtn");

        // 모달 열기
        openBtn.addEventListener("click", () => {
            modal.classList.remove("hidden");
            modal.classList.add("flex");
        });

        // 모달 닫기
        cancelBtn.addEventListener("click", () => {
            modal.classList.remove("flex");
            modal.classList.add("hidden");
        });

        // 바깥 영역 클릭 시 닫기
        modal.addEventListener("click", (event) => {
            if (event.target === modal) {
                modal.classList.remove("flex");
                modal.classList.add("hidden");
            }
        });

        // flash 메시지 alert 처리
        const success = document.getElementById("flash-success");
        const error = document.getElementById("flash-error");

        if (success) alert(success.textContent);
        if (error) alert(error.textContent);
    });

    //앨범 삭제 기능 (Controller에서 처리 후 리다이렉트 사용)
    function submitDeleteForm(formId) {
        const form = document.getElementById(formId);
        if (!confirm("정말 이 앨범을 삭제하시겠습니까?")) return;
        form.submit();
    }
</script>

</th:block>
</html>
