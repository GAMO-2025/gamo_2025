<th:block th:fragment="inputModal(placeholder, submitText, cancelText)">
    <!-- 모달 -->
    <div id="inputModal"
         class="fixed inset-0 z-[1000] hidden bg-black/60 backdrop-blur-[2px]" role="dialog" aria-modal="true">

    <!-- 실제 모달 박스 -->
    <div class="absolute left-1/2
           bottom-[calc(env(safe-area-inset-bottom)+110px)]
           -translate-x-1/2
           w-[320px] max-w-[90%]
           rounded-2xl bg-white p-5
           shadow-[0_12px_30px_rgba(0,0,0,0.18)]
           transition-transform duration-200 ease-out">
        <form id="submitForm" onsubmit="return false;">
            <div class="mb-4">
                <label for="input" class="block text-gray-500 text-sm mb-1" ></label>
                <input id="input"
                       class="w-full border-b border-amber-400 px-1 py-2 outline-none text-gray-900"
                       th:placeholder="${placeholder}" />
            </div>

            <div class="flex gap-3 justify-center">
                <button type="submit"
                        th:text="${submitText}"
                        class="flex-1 rounded-2xl bg-amber-400 text-white py-3 font-semibold">
                    변경하기
                </button>
                <button type="button" data-modal-close
                        th:text="${cancelText}"
                        class="flex-1 rounded-2xl border border-gray-300 py-3 font-semibold text-gray-700 bg-white">
                    돌아가기
                </button>
            </div>
        </form>
    </div>
    </div>

</th:block>
