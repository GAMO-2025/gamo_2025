<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<h2>사진 목록</h2>

<div class="photo-container">
    <div>
        <img th:src="@{'https://storage.cloud.google.com/gamo_bucket/photo/' + ${photoData.url}}" alt="앨범 사진">
    </div>
    <p th:text="${#temporals.format(photoData.created_at, 'yyyy-MM-dd HH:mm')}">생성일</p>
    <div></div>
    <button class="delete-btn" th:data-id="${photoData.photo_id}">지우기</button>
    <button class="like-btn" th:data-id="${photoData.photo_id}">좋아요</button>
</div>
</body>
</html>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        // 삭제 버튼
        const deleteButtons = document.querySelectorAll(".delete-btn");
        deleteButtons.forEach(btn => {
            btn.addEventListener("click", async function () {
                const photoId = this.dataset.id;
                if (!confirm("이 사진을 정말 삭제하시겠습니까?")) return;

                try {
                    const response = await fetch(`/photo/delete/${photoId}`, {
                        method: "DELETE",
                    });
                    if (response.ok) {
                        alert("사진이 삭제되었습니다.");
                        location.reload();
                    } else {
                        alert("삭제 중 오류가 발생했습니다.");
                    }
                } catch (error) {
                    console.error(error);
                    alert("네트워크 오류가 발생했습니다.");
                }
            });
        });

        // 좋아요 버튼
        const likeButtons = document.querySelectorAll(".like-btn");
        likeButtons.forEach(btn => {
            btn.addEventListener("click", async function () {
                const photoId = this.dataset.id;
                const memberId = 1; // 임시 (일단 하드코딩)

                try {
                    const response = await fetch(`/photoLike/${photoId}`, {
                        method: "POST"
                    });

                    if (response.ok) {
                        const isLiked = (await response.text()).trim();
                        if (isLiked === "liked") {
                            alert("좋아요 추가됨!");
                            this.textContent = "좋아요 취소";
                        } else {
                            alert("좋아요 취소됨!");
                            this.textContent = "좋아요";
                        }
                    } else {
                        alert("좋아요 처리 중 오류가 발생했습니다.");
                    }
                } catch (error) {
                    console.error(error);
                    alert("네트워크 오류가 발생했습니다.");
                }
            });
        });
    });
</script>
