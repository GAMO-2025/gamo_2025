<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>가모 – 앨범</title>
    <link rel="stylesheet" th:href="@{/main.css}" />
    <style>
        /* iOS notch 안전 여백용 (Tailwind로 못하는 부분만 보강) */
        :root { --safe-top: env(safe-area-inset-top); --safe-bottom: env(safe-area-inset-bottom); }
    </style>
</head>
<body class="bg-neutral-100 flex items-center justify-center min-h-screen">

<main class="relative w-screen min-h-screen overflow-auto shadow-xl"
      style="padding-top: 90px; padding-bottom: var(--safe-bottom);">
    <div class="bg-white shadow-lg rounded-xl p-8 text-center w-80">
        <h2 class="text-2xl font-bold mb-4">우리 가족! 다 같이 모여보자</h2>
        <h1 class="text-green-700 mb-6">가족 초대 코드</h1>
        <div class="text-xl text-orange-500 font-mono mb-6">
            <h3 th:text="${familyCode}">코드가 없습니다</h3>
        </div>
    </div>
</main>

</body>
</html>
