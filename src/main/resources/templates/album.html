<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>가모 – 앨범</title>
    <link rel="stylesheet" th:href="@{/main.css}" />
    <style>
        /* iOS notch 안전 여백용 (Tailwind로 못하는 부분만 보강) */
        :root { --safe-top: env(safe-area-inset-top); --safe-bottom: env(safe-area-inset-bottom); }
    </style>
</head>
<body class="bg-neutral-100 flex items-center justify-center min-h-screen">

<!-- 헤더 -->
<div th:replace="fragments/header :: header"></div>
<main
        class="relative w-screen min-h-screen overflow-auto shadow-xl"
        style="padding-top: 90px; padding-bottom: var(--safe-bottom);"
>
    <section class="grid grid-cols-2 gap-2 p-4">
        <div th:each="album : ${albums}"
             class="relative rounded-2xl shadow-md h-40 overflow-hidden cursor-pointer">

            <!-- 배경 이미지 -->
<!--            <img th:src="@{'https://storage.cloud.google.com/gamo_bucket/photo/' + ${album.thumbnailUrl}}"-->
<!--                 class="absolute inset-0 w-full h-full object-cover" alt="앨범 사진">-->
            <div th:if="${album.thumbnailUrl != null}">
                <img th:src="@{'https://storage.cloud.google.com/gamo_bucket/photo/' + ${album.thumbnailUrl}}"
                     class="absolute inset-0 w-full h-full object-cover" alt="앨범 사진">
            </div>
            <div th:unless="${album.thumbnailUrl != null}"
                 class="absolute inset-0 w-full h-full bg-white"></div>


            <!-- 오버레이 + 앨범 제목 -->
            <a th:href="@{'/album/' + ${album.albumId}}"
               class="absolute inset-0 flex items-center justify-center bg-black/30 text-white text-lg font-bold">
                <span th:text="${album.title}">앨범 제목</span>
            </a>
        </div>
        <!--앨범 만들기-->
        <div class="bg-green-500 rounded-2xl shadow-md h-40 flex items-center justify-center text-white font-bold cursor-pointer text-6xl"
             id="openModalBtn">
            +
        </div>
    </section>
    <div id="albumModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <!-- 모달 박스 -->
        <div class="bg-white rounded-2xl shadow-lg p-8 w-96">
            <h2 class="text-xl font-bold mb-4 text-gray-800">앨범 만들기</h2>
            <form th:action="@{/album/new}" method="post" id="albumForm">
                <input type="text" name="albumTitle"
                       placeholder="앨범 이름을 입력하세요"
                       class="w-full border border-gray-300 rounded-lg p-2 mb-4 focus:outline-none focus:ring-2 focus:ring-green-400"
                       required />

                <div class="flex justify-end gap-3">
                    <button type="button" id="cancelModalBtn"
                            class="px-4 py-2 rounded-lg bg-gray-300 text-gray-800 hover:bg-gray-400">
                        취소
                    </button>
                    <button type="submit"
                            class="px-4 py-2 rounded-lg bg-green-500 text-white hover:bg-green-600">
                        추가
                    </button>
                </div>
            </form>
        </div>
    </div>
</main>

<!-- 푸터 -->
<div th:replace="fragments/footer :: BottomNav('album')"></div>

</body>
<!--<script src="https://cdn.tailwindcss.com"></script>-->
<script>
    <!-- 모달 스크립트 -->
    document.addEventListener("DOMContentLoaded", () => {
        const modal = document.getElementById("albumModal");
        const openBtn = document.getElementById("openModalBtn");
        const cancelBtn = document.getElementById("cancelModalBtn");

        // 모달 열기
        openBtn.addEventListener("click", () => {
            modal.classList.remove("hidden");
            modal.classList.add("flex");
        });

        // 모달 닫기
        cancelBtn.addEventListener("click", () => {
            modal.classList.remove("flex");
            modal.classList.add("hidden");
        });

        // 바깥 영역 클릭 시 닫기
        modal.addEventListener("click", (event) => {
            if (event.target === modal) {
                modal.classList.remove("flex");
                modal.classList.add("hidden");
            }
        });
    });
</script>
</html>
